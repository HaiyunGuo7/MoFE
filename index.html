<script>
// Shell script: the only script shipped in the clear. It contains no content.
// Key derivation: PBKDF2-HMAC-SHA256 (iteration count and salt in #cfg) -> AES-256-GCM key.
// Every encrypted object is  IV (12 bytes) || ciphertext || tag (16 bytes),  with the object's
// opaque name as additional authenticated data. Large resources are split into parts that are
// fetched and decrypted only when the page asks for them.
(function () {
  'use strict';
  var cfg = JSON.parse(document.getElementById('cfg').textContent);
  var form = document.getElementById('gate-form');
  var input = document.getElementById('gate-code');
  var button = document.getElementById('gate-submit');
  var msg = document.getElementById('gate-msg');
  var subtle = window.crypto && window.crypto.subtle;
  var enc = new TextEncoder();
  var key = null;
  var resources = {};
  var pending = new Map();

  function say(text, isError) { msg.textContent = text; msg.className = isError ? 'error' : ''; }

  function b64ToBytes(s) {
    var bin = atob(s), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  async function deriveKey(code) {
    var base = await subtle.importKey('raw', enc.encode(code), 'PBKDF2', false, ['deriveKey']);
    return subtle.deriveKey({ name: 'PBKDF2', salt: b64ToBytes(cfg.salt), iterations: cfg.iterations, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  }

  function decrypt(k, bytes, name) {
    return subtle.decrypt({ name: 'AES-GCM', iv: bytes.subarray(0, 12), additionalData: enc.encode(name), tagLength: 128 },
      k, bytes.subarray(12));
  }

  async function fetchBytes(name, onBytes) {
    var resp = await fetch(name, { credentials: 'omit', cache: 'force-cache' });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    if (!onBytes || !resp.body || !resp.body.getReader) return new Uint8Array(await resp.arrayBuffer());
    var reader = resp.body.getReader(), chunks = [], total = 0;
    for (;;) {
      var step = await reader.read();
      if (step.done) break;
      chunks.push(step.value); total += step.value.length; onBytes(step.value.length);
    }
    var out = new Uint8Array(total), off = 0;
    for (var i = 0; i < chunks.length; i++) { out.set(chunks[i], off); off += chunks[i].length; }
    return out;
  }

  // Fetch and decrypt one resource; returns a Blob. onProgress(fraction) is optional.
  async function loadBlob(id, onProgress) {
    var r = resources[id];
    if (!r) throw new Error('unknown resource');
    var got = 0, parts = [];
    for (var i = 0; i < r.parts.length; i++) {
      var bytes = await fetchBytes(r.parts[i], onProgress ? function (n) { got += n; onProgress(Math.min(1, got / r.stored)); } : null);
      parts.push(await decrypt(key, bytes, r.parts[i]));
    }
    return new Blob(parts, { type: r.mime });
  }

  // Object URL of a resource, decrypted once and then reused.
  function loadUrl(id) {
    if (!pending.has(id)) {
      var p = loadBlob(id).then(function (b) { return URL.createObjectURL(b); });
      p.catch(function () { pending.delete(id); });
      pending.set(id, p);
    }
    return pending.get(id);
  }

  var api = {
    info: function (id) { return resources[id] || null; },
    blob: loadBlob,
    url: loadUrl,
    isFile: location.protocol === 'file:'
  };

  async function unlock(code) {
    var k = await deriveKey(code);
    var plain = await decrypt(k, b64ToBytes(cfg.body), 'body');
    var doc = JSON.parse(new TextDecoder().decode(plain));
    key = k; resources = doc.resources;
    var style = document.createElement('style'); style.textContent = doc.css; document.head.appendChild(style);
    document.title = doc.title;
    var page = document.getElementById('page');
    page.innerHTML = doc.html; page.hidden = false;
    document.getElementById('gate').remove();
    window.scrollTo(0, 0);
    (new Function('api', doc.js))(api);
  }

  if (!subtle) {
    say('This page cannot be decrypted in this context. Open it over HTTPS or from http://localhost.', true);
    button.disabled = true; input.disabled = true;
  }

  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (!subtle || button.disabled) return;
    var code = input.value;
    if (!code) return;
    button.disabled = true; say('Decrypting…', false);
    // let the message paint before the key derivation starts
    setTimeout(function () {
      unlock(code).catch(function (err) {
        button.disabled = false;
        if (key) { say('The page was decrypted but could not be displayed (' + err.message + ').', true); return; }
        say("The access code is not correct.", true);
        input.select(); input.focus();
      });
    }, 30);
  });
})();

</script>
